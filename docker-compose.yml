services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telefraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-telefraud_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for local psql access; remove if you only use the bot.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telefraud} -d ${POSTGRES_DB:-telefraud_db}"]
      interval: 5s
      timeout: 3s
      retries: 12

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Compose always points the bot at the `db` service, overriding any
      # host-oriented DATABASE_URL in .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-telefraud}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-telefraud_db}?sslmode=disable
      ADMIN_IDS: ${ADMIN_IDS:-}
      ADMIN_LOG_CHAT_ID: ${ADMIN_LOG_CHAT_ID:-0}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      DEVELOPER_NAME: ${DEVELOPER_NAME:-xspoilt}
      DEVELOPER_USERNAME: ${DEVELOPER_USERNAME:-@xspoilt}
    volumes:
      - backups:/backups

volumes:
  pgdata:
  backups:
